name: 'gitea-release-please-action'
description: 'automated releases based on conventional commits, for Gitea and Forgejo'
author: Google LLC
inputs:
  token:
    description: 'Gitea token for pushing release branches and grooming release PRs, defaults to the workflow token'
    required: false
    default: ${{ github.token }}
  release-type:
    description: 'what type of release is this, one of (ruby, python, node, terraform-module)'
    required: false
    default: ''
  path:
    description: "create a release from a path other than the repository's root"
    required: false
    default: ''
  target-branch:
    description: branch to open pull release PR against (detected by default)
    required: false
    default: ''
  config-file:
    description: 'where can the config file be found in the project?'
    required: false
    default: ''
  manifest-file:
    description: 'where can the manifest file be found in the project?'
    required: false
    default: ''
  repo-url:
    description: 'repository in the form `<owner>/<repo>`. Default `process.env.GITHUB_REPOSITORY`'
    required: false
    default: ${{ github.repository }}
  gitea-url:
    description: 'URL of the Gitea/Forgejo server, e.g. `https://gitea.example.com`. Defaults to the server running the workflow'
    required: false
    default: ${{ github.server_url }}
  clone-depth:
    description: 'limit the history fetched for the internal clone. Defaults to the full history'
    required: false
    default: ''
  git-author-name:
    description: 'author/committer name for release commits. Default `release-please[bot]`'
    required: false
    default: ''
  git-author-email:
    description: 'author/committer email for release commits'
    required: false
    default: ''
  fork:
    description: 'not supported on Gitea; ignored'
    required: false
    default: false
  include-component-in-tag:
    description: 'If true, add prefix to tags and branches, allowing multiple libraries to be released from the same repository'
    required: false
    default: false
  skip-github-release:
    description: 'if set to true, then do not try to tag releases'
    required: false
    default: false
  skip-github-pull-request:
    description: 'if set to true, then do not try to open pull requests'
    required: false
    default: false
  skip-labeling:
    description: 'if set to true, then do not try to label the PR'
    required: false
    default: false
  changelog-host:
    description: 'The proto://host used for changelog links. Defaults to `gitea-url`'
    required: false
    default: ''
  versioning-strategy:
    description: 'The versioning strategy to use.'
    required: false
    default: 'default'
  release-as:
    description: 'The version to release as.'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
